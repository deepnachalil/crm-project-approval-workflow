# Local development database. Credentials below are throwaway local-only values.
services:
  postgres:
    image: postgres:17-alpine
    container_name: crm_projects_db
    environment:
      POSTGRES_DB: crm_projects
      POSTGRES_USER: crm_local
      POSTGRES_PASSWORD: crm_local_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_local -d crm_projects"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
